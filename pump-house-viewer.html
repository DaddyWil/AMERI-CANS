    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",

    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",

<three-d-stage name="pump-house-500gal" background="#ffffff"></three-d-stage>
<script>
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
// Copied omelette starter. Re-running copy_starter_component with this kind overwrites this file with the latest version (page content is unaffected).
/* BEGIN USAGE */
/**
 * <three-d-stage> — 3D object viewer + exporter shell (three.js).
 *
 * The stage owns the whole scene: WebGL renderer, neutral studio lighting
 * with a soft ground shadow, orbit controls (drag to orbit, wheel to zoom,
 * right-drag to pan), a camera auto-framed to the object's bounds, resize
 * handling, and a download toolbar that exports the current object as
 * OBJ + MTL or GLB (binary glTF). FBX cannot be exported in the browser;
 * GLB is the interchange format every modern 3D tool imports.
 *
 * three.js loads through the page's import map. Include this EXACT pinned
 * map in <head>, before any module runs — versions and integrity hashes
 * stay together (same map the "3D object" skill mandates):
 *
 *   <script type="importmap">
 *   {
 *     "imports": {
 *       "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
 *       "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 *       "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
 *       "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
 *     },
 *     "integrity": {
 *       "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
 *       "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
 *     }
 *   }
 *   <\/script>
 *
 * Usage:
 *   <style>three-d-stage:not(:defined){visibility:hidden}</style>
 *   <three-d-stage name="rocket"></three-d-stage>
 *   <script src="three-d-stage.js"><\/script>
 *   <script type="module">
 *     const stage = document.querySelector('three-d-stage');
 *     const { THREE } = await stage.ready;
 *     const model = new THREE.Group();
 *     // …build the model out of named meshes with named materials —
 *     // the names become the o / usemtl entries in the exported OBJ…
 *     stage.setObject(model);
 *   <\/script>
 *
 * Attributes:
 *   name       — export file basename (default "model")
 *   background — CSS color behind the scene (default a warm paper tone)
 *   autorotate — when present, a slow turntable until the user interacts
 *
 * Model in real-world meters, centered on the origin, y-up — exports
 * inherit the scene's units and orientation. The stage fills its own box;
 * size it with ordinary CSS (default 100vw/100vh page hero).
 *
 * Default setup: neutral studio lighting (hemisphere + key + fill), a
 * soft ground shadow, and NO environment map — so high metalness has
 * nothing to reflect and renders near-black. Cap metalness around
 * 0.3–0.4 and carry a metal look with a brighter base color. The copied
 * file is yours: adjust the lights, shadow, or background in _boot()
 * when the object needs a different look.
 */
/* END USAGE */

(() => {
  const stylesheet = `
    :host {
      position: relative;
      display: block;
      width: 100%;
      height: 100vh;
      background: var(--stage-bg, #f0eee6);
      overflow: hidden;
    }
    canvas { display: block; outline: none; }
    .toolbar {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .toolbar button {
      appearance: none;
      border: 1px solid rgba(20, 20, 19, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #1a1915;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 12px;
      cursor: default;
    }
    .toolbar button:hover { background: #fff; }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar button[disabled] { opacity: 0.5; pointer-events: none; }
    .note {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: 60%;
      font: 400 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: rgba(26, 25, 21, 0.55);
      user-select: none;
    }
    .err {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 500 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8a2f20;
      text-align: center;
      white-space: pre-line;
    }
  `;

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /** Tell the host an export attempt settled — telemetry only. The host
   *  (HTMLViewer) verifies the source and re-reads these fields defensively
   *  before counting; nothing else crosses the frame boundary. Guarded so
   *  telemetry can never break the download path. */
  function notifyExport(format, ok) {
    try {
      window.parent.postMessage(
        { type: 'omelette:notify-3d-export', format: format, ok: ok === true },
        '*'
      );
    } catch (e) {}
  }

  class ThreeDStage extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      const style = document.createElement('style');
      style.textContent = stylesheet;
      root.appendChild(style);
      this._err = document.createElement('div');
      this._err.className = 'err';
      root.appendChild(this._err);
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'Drag to orbit · scroll to zoom · right-drag to pan';
      root.appendChild(note);
      this._toolbar = document.createElement('div');
      this._toolbar.className = 'toolbar';
      this._objBtn = document.createElement('button');
      this._objBtn.type = 'button';
      this._objBtn.textContent = 'Download OBJ + MTL';
      this._objBtn.addEventListener('click', () => this._runExport('obj'));
      this._glbBtn = document.createElement('button');
      this._glbBtn.type = 'button';
      this._glbBtn.textContent = 'Download GLB';
      this._glbBtn.addEventListener('click', () => this._runExport('glb'));
      this._toolbar.appendChild(this._objBtn);
      this._toolbar.appendChild(this._glbBtn);
      root.appendChild(this._toolbar);
      this._setButtonsEnabled(false);
      /** Resolves with { THREE } once the scene is live — build the model
       *  in `await stage.ready` so nothing races the library load. */
      this.ready = new Promise((resolve, reject) => {
        this._readyResolve = resolve;
        this._readyReject = reject;
      });
    }

    connectedCallback() {
      if (this._booted) {
        // Re-attached after a removal — resume what disconnected stopped.
        if (this._renderer) {
          this._renderer.setAnimationLoop(this._loop);
          this._ro && this._ro.observe(this);
        }
        return;
      }
      this._booted = true;
      this._boot().catch((err) => {
        this._err.style.display = 'flex';
        this._err.textContent =
          'three.js failed to load.\n' +
          'Check that the pinned <script type="importmap"> from the usage ' +
          'notes is in <head> before any module script.\n\n' +
          String(err && err.message ? err.message : err);
        this._readyReject(err);
      });
    }

    async _boot() {
      const bg = this.getAttribute('background');
      if (bg) this.style.setProperty('--stage-bg', bg);
      const [THREE, controlsMod] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
      ]);
      this._THREE = THREE;
      // preserveDrawingBuffer keeps the last frame readable after
      // compositing (toDataURL / drawImage) — it's what lets the
      // screenshot tools capture the scene instead of a blank canvas.
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      this._renderer = renderer;
      this.shadowRoot.insertBefore(renderer.domElement, this._err);

      const scene = new THREE.Scene();
      this._scene = scene;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 500);
      camera.position.set(3, 2.2, 4);
      this._camera = camera;

      const controls = new controlsMod.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      this._controls = controls;

      // Neutral studio: soft sky/ground wash, a shadow-casting key light,
      // and a dim fill from behind so silhouettes never go black.
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 1.0));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(4, 7, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0002;
      this._key = key;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xfff4e6, 0.5);
      fill.position.set(-5, 3, -4);
      scene.add(fill);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      this._ground = ground;
      scene.add(ground);

      this._autorotate = this.hasAttribute('autorotate');
      controls.autoRotate = this._autorotate;
      controls.autoRotateSpeed = 1.2;
      controls.addEventListener('start', () => {
        controls.autoRotate = false;
      });

      const fit = () => {
        const w = this.clientWidth || 1;
        const h = this.clientHeight || 1;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      fit();
      this._ro = new ResizeObserver(fit);
      this._loop = () => {
        controls.update();
        renderer.render(scene, camera);
      };
      // Detached while three.js was fetching? Stay idle — the
      // connectedCallback resume starts the loop and observer on
      // reattach.
      if (this.isConnected) {
        this._ro.observe(this);
        renderer.setAnimationLoop(this._loop);
      }

      this._readyResolve({ THREE });
    }

    disconnectedCallback() {
      // Stop rendering and observing while detached; connectedCallback
      // resumes both. (The renderer itself is kept — a move within the
      // document must not rebuild the scene.)
      if (this._renderer) this._renderer.setAnimationLoop(null);
      if (this._ro) this._ro.disconnect();
    }

    /** Show (and own) the object. Replaces any previous object, enables
     *  shadows on every mesh, rests it on the ground plane, and frames
     *  the camera to its bounds. */
    setObject(object) {
      const THREE = this._THREE;
      if (!THREE) throw new Error('three-d-stage: not ready — await stage.ready first');
      if (this._object) this._scene.remove(this._object);
      this._object = object;
      object.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      const box = new THREE.Box3().setFromObject(object);
      if (!box.isEmpty()) {
        // Rest the object on the ground without moving its origin.
        this._ground.position.y = box.min.y;
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const dist =
          (sphere.radius / Math.tan((this._camera.fov * Math.PI) / 360)) * 1.35;
        const dir = new THREE.Vector3(1, 0.55, 1.25).normalize();
        this._camera.position
          .copy(sphere.center)
          .add(dir.multiplyScalar(dist));
        this._camera.near = Math.max(dist / 100, 0.01);
        this._camera.far = dist * 100;
        this._camera.updateProjectionMatrix();
        this._controls.target.copy(sphere.center);
        this._controls.update();
        const span = sphere.radius * 3;
        this._key.shadow.camera.left = -span;
        this._key.shadow.camera.right = span;
        this._key.shadow.camera.top = span;
        this._key.shadow.camera.bottom = -span;
        this._key.shadow.camera.updateProjectionMatrix();
      }
      this._scene.add(object);
      this._setButtonsEnabled(true);
    }

    get _basename() {
      return (this.getAttribute('name') || 'model').replace(/[^\w.-]+/g, '_');
    }

    _setButtonsEnabled(on) {
      this._objBtn.disabled = !on;
      this._glbBtn.disabled = !on;
    }

    /** Every mesh and material needs a unique name for o/usemtl lines —
     *  fill in stable fallbacks, and return the unique material list. */
    _nameParts() {
      const mats = [];
      const seen = new Set();
      let meshI = 0;
      let matI = 0;
      this._object.traverse((o) => {
        if (!o.isMesh) return;
        if (!o.name) o.name = 'part_' + meshI;
        meshI += 1;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of list) {
          if (!m || mats.includes(m)) continue;
          if (!m.name) {
            m.name = 'mat_' + matI;
            matI += 1;
          }
          while (seen.has(m.name)) {
            m.name = m.name + '_' + matI;
            matI += 1;
          }
          seen.add(m.name);
          mats.push(m);
        }
      });
      return mats;
    }

    /** One export attempt, reported to the host however it settles.
     *  Rethrows so a failure stays visible on the guest console exactly as
     *  before. The no-object early return is not an attempt (the toolbar is
     *  disabled until the model loads) and reports nothing. */
    async _runExport(format) {
      if (!this._object) return;
      try {
        await (format === 'obj' ? this._exportObj() : this._exportGlb());
        notifyExport(format, true);
      } catch (err) {
        notifyExport(format, false);
        throw err;
      }
    }

    async _exportObj() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/OBJExporter.js');
      const mats = this._nameParts();
      const base = this._basename;
      const obj =
        'mtllib ' + base + '.mtl\n' + new mod.OBJExporter().parse(this._object);
      let mtl = '# Exported by three-d-stage\n';
      for (const m of mats) {
        const c = m.color || { r: 0.8, g: 0.8, b: 0.8 };
        const rough = typeof m.roughness === 'number' ? m.roughness : 0.5;
        const opacity = typeof m.opacity === 'number' ? m.opacity : 1;
        mtl += 'newmtl ' + m.name + '\n';
        mtl +=
          'Kd ' + c.r.toFixed(4) + ' ' + c.g.toFixed(4) + ' ' + c.b.toFixed(4) + '\n';
        mtl += 'Ks 0.2000 0.2000 0.2000\n';
        mtl += 'Ns ' + Math.round((1 - rough) * 200) + '\n';
        mtl += 'd ' + opacity.toFixed(4) + '\n\n';
      }
      download(new Blob([obj], { type: 'text/plain' }), base + '.obj');
      download(new Blob([mtl], { type: 'text/plain' }), base + '.mtl');
    }

    async _exportGlb() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/GLTFExporter.js');
      this._nameParts();
      const base = this._basename;
      const buf = await new mod.GLTFExporter().parseAsync(this._object, {
        binary: true,
      });
      download(
        new Blob([buf], { type: 'model/gltf-binary' }),
        base + '.glb'
      );
    }
  }

  customElements.define('three-d-stage', ThreeDStage);
})();

</script>
<script>
// 500 Gal Pump House: rough 3D model, the jobsite trailer it serves, and the yard. Classic script (window.PumpHouseModel),
// shared by Pump House Model.html and Pump House Viewer.html. Meters, y-up. +x = door end, +z = logo wall (front, 6 ft), -z = tall wall (7 ft) toward the trailer.
// Dimensions from the build manual: 4 x 8 ft treated floor on 4x4 skids, 2x4 walls at 24 in, shed roof falling to the front, 2 ft 8 in x 5 ft 10.5 in door, T1-11 siding, galvanized roof, 2 in foam board inside.
(function () {
  const IN = 0.0254, FT = 0.3048;

  // Trapezoidal corrugated sheet. Local: length along x (centered), height along +y from 0, outer flats at z = 0, recesses toward +z.
  function corrugated(THREE, name, m, length, height, pitchTarget = 0.21, depth = 0.036, thick = 0.016) {
    const n = Math.max(1, Math.round(length / pitchTarget));
    const pitch = length / n, flat = pitch * 0.34, slope = (pitch - 2 * flat) / 2;
    const pts = [[0, 0]];
    let x = 0;
    for (let i = 0; i < n; i++) { x += flat; pts.push([x, 0]); x += slope; pts.push([x, -depth]); x += flat; pts.push([x, -depth]); x += slope; pts.push([x, 0]); }
    const s = new THREE.Shape();
    s.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
    for (let i = pts.length - 1; i >= 0; i--) s.lineTo(pts[i][0], pts[i][1] - thick);
    s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: height, bevelEnabled: false, steps: 1 });
    g.translate(-length / 2, 0, 0);
    g.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(g, m);
    mesh.name = name;
    return mesh;
  }

  const mat = (THREE, name, color, roughness, metalness, extra) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness, metalness }, extra || {})); m.name = name; return m; };
  const helpers = (THREE, root) => {
    const grp = (name, parent = root) => { const g = new THREE.Group(); g.name = name; parent.add(g); return g; };
    const box = (name, m, w, h, d, x, y, z, parent = root) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.name = name; o.position.set(x, y, z); parent.add(o); return o; };
    const cyl = (name, m, r, len, x, y, z, axis = 'y', parent = root, seg = 24) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m); if (axis === 'x') o.rotation.z = Math.PI / 2; if (axis === 'z') o.rotation.x = Math.PI / 2; o.name = name; o.position.set(x, y, z); parent.add(o); return o; };
    const sph = (name, m, r, x, y, z, parent = root) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); o.name = name; o.position.set(x, y, z); parent.add(o); return o; };
    const pipe = (name, m, r, a, b, parent = root) => {
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
      const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), m); o.name = name;
      o.position.copy(A).add(B).multiplyScalar(0.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
      parent.add(o); return o;
    };
    // polyline of pipe with rounded elbows
    const run = (name, m, r, pts, parent = root) => { for (let i = 0; i < pts.length - 1; i++) pipe(name, m, r, pts[i], pts[i + 1], parent); for (let i = 1; i < pts.length - 1; i++) sph(name + '_elbow', m, r * 1.12, pts[i][0], pts[i][1], pts[i][2], parent); };
    // Flat panel in the yz plane from [z, y] points, extruded `thick` toward -x from x = xFace; optional rectangular hole [z0, y0, z1, y1].
    const endPanel = (name, m, pts, thick, xFace, hole, parent = root) => {
      const s = new THREE.Shape(); pts.forEach(([z, y], i) => (i ? s.lineTo(z, y) : s.moveTo(z, y))); s.closePath();
      if (hole) { const h = new THREE.Path(); h.moveTo(hole[0], hole[1]); h.lineTo(hole[2], hole[1]); h.lineTo(hole[2], hole[3]); h.lineTo(hole[0], hole[3]); h.closePath(); s.holes.push(h); }
      const o = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false }), m);
      o.name = name; o.rotation.y = -Math.PI / 2; o.position.set(xFace, 0, 0); parent.add(o); return o;
    };
    return { grp, box, cyl, sph, pipe, run, endPanel };

    box('siding_back', M.siding, L, ySid(-W / 2) - SY0, SID, 0, (ySid(-W / 2) + SY0) / 2, -W / 2 + SID / 2, walls);
    const ZE = W / 2 - SID;
    const endPts = [[-ZE, SY0], [ZE, SY0], [ZE, ySid(ZE)], [-ZE, ySid(-ZE)]];
    endPanel('siding_end_rear', M.siding, endPts, SID, -L / 2 + SID, null, walls);
    endPanel('siding_end_door', M.siding, endPts, SID, L / 2, [DZ0, FLOOR, DZ1, FLOOR + OPEN_H], walls);
    for (let k = 1; k < 12; k++) {
      const x = -L / 2 + k * GP;
      groove('groove_front', x, W / 2 + 0.0015, SY0 + 0.01, ySid(W / 2) - 0.01, 'x', walls);
      groove('groove_back', x, -W / 2 - 0.0015, SY0 + 0.01, ySid(-W / 2) - 0.01, 'x', walls);
    }
    for (let k = 1; k < 6; k++) {
      const z = -W / 2 + k * GP;
      groove('groove_end_rear', -L / 2 - 0.0015, z, SY0 + 0.01, ySid(z) - 0.01, 'z', walls);
      if (z < DZ0 - 0.01 || z > DZ1 + 0.01) groove('groove_end_door', L / 2 + 0.0015, z, SY0 + 0.01, ySid(z) - 0.01, 'z', walls);
      else { groove('groove_end_door', L / 2 + 0.0015, z, SY0 + 0.01, FLOOR - 0.01, 'z', walls); groove('groove_end_door', L / 2 + 0.0015, z, FLOOR + OPEN_H + 0.01, ySid(z) - 0.01, 'z', walls); }
    }
    // stencil logo on the front wall
    const LOGO_W = 1.55, LOGO_H = LOGO_W * 644 / 1720;
    const logo = new THREE.Mesh(new THREE.PlaneGeometry(LOGO_W, LOGO_H), logoMat); logo.name = 'logo_front'; logo.position.set(-0.05, 1.15, W / 2 + 0.003); walls.add(logo);

    /* ---- framing seen from inside ---- */
    const frame = grp('framing');
    const studX = [-L / 2 + SID + STUD / 2, -0.61, 0, 0.61, L / 2 - SID - STUD / 2];
    for (const x of studX) {
      box('stud_front', M.iwood, STUD, H_FRONT - PLATE - FLOOR, STUD_D, x, (H_FRONT - PLATE + FLOOR) / 2, W / 2 - SID - STUD_D / 2, frame);
      box('stud_back', M.iwood, STUD, H_BACK - PLATE - FLOOR, STUD_D, x, (H_BACK - PLATE + FLOOR) / 2, -W / 2 + SID + STUD_D / 2, frame);
    }
    box('top_plate_front', M.iwood, L - 2 * SID, PLATE, STUD_D, 0, H_FRONT - PLATE / 2, W / 2 - SID - STUD_D / 2, frame);
    box('top_plate_back', M.iwood, L - 2 * SID, PLATE, STUD_D, 0, H_BACK - PLATE / 2, -W / 2 + SID + STUD_D / 2, frame);
    const endStud = (name, x, z) => box(name, M.iwood, STUD_D, yLine(z) - PLATE - FLOOR, STUD, x, (yLine(z) - PLATE + FLOOR) / 2, z, frame);
    endStud('stud_rear', -L / 2 + SID + STUD_D / 2, 0);
    endStud('door_stud', L / 2 - SID - STUD_D / 2, DZ0 - STUD / 2);
    endStud('door_stud', L / 2 - SID - STUD_D / 2, DZ1 + STUD / 2);
    box('door_header', M.iwood, STUD_D, STUD, DZ1 - DZ0 + 2 * STUD, L / 2 - SID - STUD_D / 2, FLOOR + OPEN_H + STUD / 2, (DZ0 + DZ1) / 2, frame);
    for (const sx of [-1, 1]) { const p = box('top_plate_end', M.iwood, STUD_D, PLATE, (W - 2 * SID) / COS, sx * (L / 2 - SID - STUD_D / 2), (H_BACK + H_FRONT) / 2 - PLATE / 2, 0, frame); p.rotation.x = SLOPE; }

    /* ---- roof: rafters wall to wall (4 ft 1 9/16 in, no tails), furring, foam ceiling, galvanized sheet overhanging the eaves ---- */
    const roof = grp('roof');
    const midY = (H_BACK + H_FRONT) / 2, RAFTER_L = (W - 2 * SID) / COS;
    for (const x of studX) { const r = box('rafter', M.iwood, STUD, STUD_D, RAFTER_L, x, midY + STUD_D / 2 / COS, 0, roof); r.rotation.x = SLOPE; }
    for (const z of [-0.5, 0, 0.5]) { const f = box('furring_strip', M.iwood, L - 2 * SID, 0.02, STUD, 0, yLine(z) + (STUD_D + 0.01) / COS, z, roof); f.rotation.x = SLOPE; }
    const ceil = box('ceiling_foam', M.foam, L - 2 * SID - 2 * STUD_D, FOAM, (W - 2 * SID - 2 * STUD_D) / COS, 0, midY + (STUD_D - FOAM / 2) / COS, 0, roof); ceil.rotation.x = SLOPE;
    const OV_END = 2 * IN, OV_EAVE = 4 * IN;
    const ROOF_L = L + 2 * OV_END, ROOF_W = (W + 2 * OV_EAVE) / COS, zStart = -W / 2 - OV_EAVE;
    const sheet = corrugated(THREE, 'roof_sheet', M.galv, ROOF_L, ROOF_W, 0.068, 0.016, 0.006);
    sheet.rotation.x = Math.PI / 2 + SLOPE;
    sheet.position.set(0, yLine(zStart) + ROOF_UP + 0.024, zStart);     // ribs rest on the furring, flats 22 mm above
    roof.add(sheet);
    // eave closure: a strip under the sheet edge so the overhang reads as one thick panel, not a floating skin
    for (const sz of [-1, 1]) { const e = box('roof_edge_' + (sz > 0 ? 'front' : 'back'), M.galv, ROOF_L, 0.012, 0.03, 0, yLine(sz * (W / 2 + OV_EAVE - 0.015)) + ROOF_UP + 0.004, sz * (W / 2 + OV_EAVE - 0.015), roof); e.rotation.x = SLOPE; }

    /* ---- foam board between the studs ---- */
    const foam = grp('insulation');
    box('foam_front', M.foam, L - 2 * SID - 2 * STUD_D, H_FRONT - PLATE - FLOOR, FOAM, 0, (H_FRONT - PLATE + FLOOR) / 2, W / 2 - SID - FOAM / 2, foam);
    box('foam_back', M.foam, L - 2 * SID - 2 * STUD_D, H_BACK - PLATE - FLOOR, FOAM, 0, (H_BACK - PLATE + FLOOR) / 2, -W / 2 + SID + FOAM / 2, foam);
    const foamPts = [[-ZI, FLOOR], [ZI, FLOOR], [ZI, yLine(ZI) - PLATE], [-ZI, yLine(-ZI) - PLATE]];
    endPanel('foam_end_rear', M.foam, foamPts, FOAM, -L / 2 + SID + FOAM, null, foam);
    // door end: the opening takes most of the width, so foam only fills the strip beside the latch-side stud
    endPanel('foam_end_door', M.foam, [[DZ1 + STUD, FLOOR], [ZI, FLOOR], [ZI, yLine(ZI) - PLATE], [DZ1 + STUD, yLine(DZ1 + STUD) - PLATE]], FOAM, L / 2 - SID, null, foam);

    /* ---- door: T1-11 leaf on a 2x4 frame, gate hinges toward the tall wall ---- */
    const door = grp('door', walls);
    door.position.set(L / 2, 0, DZ0 + 0.006);
    door.userData.door = { n: 'door', open: false, angle: 0, openAngle: Math.PI * 0.6 };
    const DY0 = FLOOR + 0.012, DYM = DY0 + DOOR_H / 2;
    box('door_panel', M.siding, SID, DOOR_H, DOOR_W, -SID / 2, DYM, DOOR_W / 2, door);
    for (let k = 1; k < 4; k++) groove('door_groove', 0.0015, k * GP, DY0 + 0.01, DY0 + DOOR_H - 0.01, 'z', door);
    const FX = -SID - STUD / 2;
    for (const y of [DY0 + STUD_D / 2, DYM, DY0 + DOOR_H - STUD_D / 2]) box('door_rail', M.iwood, STUD, STUD_D, DOOR_W, FX, y, DOOR_W / 2, door);
    for (const z of [STUD_D / 2, DOOR_W - STUD_D / 2]) box('door_stile', M.iwood, STUD, DOOR_H, STUD_D, FX, DYM, z, door);
    box('door_foam', M.foam, STUD - 0.004, DOOR_H - 2 * STUD_D, DOOR_W - 2 * STUD_D, FX, DYM, DOOR_W / 2, door);
    const HY = [DY0 + 0.45, DY0 + DOOR_H - 0.35];
    for (const y of HY) { box('hinge_strap', M.black, 0.006, 0.05, 0.3, 0.004, y, 0.15, door); cyl('hinge_barrel', M.black, 0.014, 0.1, 0.008, y, 0, 'y', door); }
    cyl('door_handle', M.black, 0.011, 0.16, 0.05, DY0 + 1.0, DOOR_W - 0.1, 'y', door);
    for (const dy of [-0.07, 0.07]) box('door_handle_stem', M.black, 0.05, 0.02, 0.02, 0.025, DY0 + 1.0 + dy, DOOR_W - 0.1, door);
    box('door_latch', M.black, 0.012, 0.03, 0.14, 0.006, DY0 + 0.85, DOOR_W - 0.05, door);
    const doorLogo = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.34 * 644 / 1720), logoMat);
    doorLogo.name = 'logo_door'; doorLogo.rotation.y = Math.PI / 2; doorLogo.position.set(0.002, DY0 + 1.45, DOOR_W / 2 + 0.03); door.add(doorLogo);
    for (const y of HY) box('hinge_plate', M.black, 0.006, 0.09, 0.06, L / 2 + 0.004, y, DZ0 - 0.03, walls);
    box('latch_keeper', M.black, 0.012, 0.05, 0.05, L / 2 + 0.006, DY0 + 0.85, DZ1 + 0.035, walls);

    /* ---- exterior fittings ---- */
    const fit = grp('fittings');
    const ZF = W / 2, ZB = -W / 2;
    const lampX = -0.1, lampY = 1.82;
    cyl('lamp_base', M.black, 0.075, 0.02, lampX, lampY, ZF + 0.01, 'z', fit);
    cyl('lamp_lens', M.lens, 0.055, 0.09, lampX, lampY, ZF + 0.065, 'z', fit);
    for (const dz of [0.045, 0.085]) cyl('lamp_cage_ring', M.black, 0.061, 0.012, lampX, lampY, ZF + dz, 'z', fit);
    cyl('lamp_cap', M.black, 0.035, 0.02, lampX, lampY, ZF + 0.12, 'z', fit);
    box('junction_box', M.gray, 0.11, 0.13, 0.07, 0.9, 1.72, ZF + 0.035, fit);
    run('power_cord', M.gray, 0.011, [[0.9, 1.65, ZF + 0.035], [0.9, 0.04, ZF + 0.035], [0.9, 0.012, ZF + 0.4], [1.5, 0.012, ZF + 0.9], [1.9, 0.012, ZF + 0.6]], fit);
    const FILL = { x: 0.3, y: 0.55 }, OVER = { x: 0.18, y: 0.78 };
    cyl('fill_stub_pvc', M.pvc, 0.024, 0.16, FILL.x, FILL.y, ZF + 0.08, 'z', fit);
    cyl('fill_camlock', M.black, 0.041, 0.09, FILL.x, FILL.y, ZF + 0.2, 'z', fit);
    for (const s of [-1, 1]) box('camlock_arm', M.black, 0.018, 0.012, 0.055, FILL.x + s * 0.046, FILL.y + 0.01, ZF + 0.19, fit);
    run('overflow_pex', M.pex, 0.011, [[OVER.x, OVER.y, ZF], [OVER.x, OVER.y, ZF + 0.14], [OVER.x - 0.02, OVER.y - 0.22, ZF + 0.15]], fit);
    cyl('supply_exit_insulated', M.insul, 0.035, 0.12, 0.6, 0.45, ZB - 0.06, 'z', fit);
    cyl('heat_trace_exit', M.cord, 0.007, 0.12, 0.66, 0.41, ZB - 0.06, 'z', fit);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const z = sz * 0.4, y = yLine(z) - 0.22;
      box('dring_plate', M.black, 0.006, 0.06, 0.06, sx * (L / 2 + 0.004), y, z, fit);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.005, 8, 20), M.black); ring.name = 'dring'; ring.rotation.y = Math.PI / 2; ring.position.set(sx * (L / 2 + 0.012), y - 0.04, z); fit.add(ring);
    }

    /* ---- inside: tank, two delivery pumps, manifold, fill and overflow lines ---- */
    const inside = grp('interior');
    const TX = -0.62, TZ = -0.02, TR = 0.42, TH = 1.45;
    const tank = grp('water_tank', inside); tank.position.set(TX, FLOOR, TZ);
    cyl('tank_body', M.tank, TR, TH, 0, TH / 2, 0, 'y', tank, 40);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(TR, 40, 14, 0, Math.PI * 2, 0, Math.PI / 2), M.tank); dome.name = 'tank_dome'; dome.scale.set(1, 0.32, 1); dome.position.y = TH; tank.add(dome);
    cyl('tank_lid', M.black, 0.11, 0.05, 0, TH + 0.14, 0, 'y', tank);
    cyl('tank_bung_fill', M.black, 0.03, 0.05, 0, TH + 0.12, 0.14, 'y', tank);
    cyl('tank_bung_overflow', M.black, 0.03, 0.05, 0, TH + 0.11, -0.18, 'y', tank);
    cyl('tank_outlet', M.brass, 0.02, 0.1, TR + 0.04, 0.12, 0.05, 'x', tank);
    const PX = 0.42, MX = PX - 0.06, UY = FLOOR + 0.86, LY = FLOOR + 0.62, zH = 0.17;
    const pumps = grp('delivery_pumps', inside);
    for (const s of [-1, 1]) {
      const g = grp(`pump_${s > 0 ? 1 : 2}`, pumps); g.position.set(PX, FLOOR, s * 0.26);
      cyl('pressure_tank', M.green, 0.13, 0.42, 0, 0.17, 0, 'x', g, 28);
      for (const dx of [-0.13, 0.13]) box('tank_foot', M.green, 0.06, 0.04, 0.2, dx, 0.02, 0, g);
      cyl('tank_flange', M.ss, 0.05, 0.02, 0.22, 0.17, 0, 'x', g);
      box('pump_saddle', M.green, 0.16, 0.1, 0.12, 0, 0.31, 0, g);
      cyl('pump_housing', M.ss, 0.1, 0.18, 0, 0.42, -s * 0.09, 'z', g);
      cyl('pump_motor', M.green, 0.085, 0.26, 0, 0.42, s * 0.13, 'z', g);
      box('motor_cap', M.black, 0.11, 0.11, 0.03, 0, 0.42, s * 0.27, g);
      box('pressure_switch', M.black, 0.07, 0.09, 0.06, 0.07, 0.56, -s * 0.03, g);
      cyl('gauge', M.black, 0.03, 0.02, -0.06, 0.55, -s * 0.16, 'x', g);
      cyl('gauge_face', M.gauge, 0.024, 0.004, -0.072, 0.55, -s * 0.16, 'x', g);
      run('pump_outlet', M.pvc, 0.017, [[MX, FLOOR + 0.5, s * zH], [MX, UY, s * zH]], inside);
      run('pump_inlet', M.pvc, 0.017, [[MX, LY, s * 0.06], [MX, FLOOR + 0.42, s * 0.06], [PX - 0.02, FLOOR + 0.42, s * 0.06]], inside);
    }
    run('manifold_upper', M.pvc, 0.017, [[MX, UY, -0.4], [MX, UY, 0.4]], inside);
    run('manifold_lower', M.pvc, 0.017, [[MX, LY, -0.4], [MX, LY, 0.4]], inside);
    const valve = (name, x, y, z, parent) => { cyl(name + '_body', M.brass, 0.028, 0.075, x, y, z, 'z', parent); cyl(name + '_stem', M.brass, 0.008, 0.03, x, y + 0.025, z, 'y', parent); box(name + '_handle', M.red, 0.012, 0.03, 0.1, x, y + 0.05, z + 0.02, parent); };
    for (const s of [-1, 1]) { valve('valve_upper', MX, UY, s * 0.3, inside); valve('valve_lower', MX, LY, s * 0.3, inside); }
    run('tank_feed', M.pvc, 0.017, [[MX, LY, 0], [MX, FLOOR + 0.12, 0], [TX + TR + 0.09, FLOOR + 0.12, TZ + 0.05]], inside);
    run('supply_drop', M.pvc, 0.017, [[MX, UY, -0.08], [MX, 0.45, -0.08], [0.6, 0.45, -0.08], [0.6, 0.45, ZB - 0.05]], inside);
    cyl('valve_supply_body', M.brass, 0.028, 0.075, MX, FLOOR + 0.72, -0.08, 'y', inside);
    box('valve_supply_handle', M.red, 0.1, 0.012, 0.03, MX + 0.06, FLOOR + 0.72, -0.08, inside);
    const FZ = ZI - 0.05;
    run('fill_line', M.pvc, 0.02, [[FILL.x, FILL.y, ZF], [FILL.x, FILL.y, FZ], [FILL.x, 1.9, FZ], [TX, 1.9, FZ], [TX, 1.9, TZ + 0.14], [TX, FLOOR + TH + 0.13, TZ + 0.14]], inside);
    run('overflow_line', M.pex, 0.011, [[TX, FLOOR + TH + 0.12, TZ - 0.18], [TX, 1.97, TZ - 0.18], [TX, 1.97, FZ + 0.03], [OVER.x, 1.97, FZ + 0.03], [OVER.x, OVER.y, FZ + 0.03], [OVER.x, OVER.y, ZF]], inside);
    for (const y of [0.9, 1.5]) box('pipe_clamp', M.ss, 0.05, 0.02, 0.06, FILL.x, y, FZ + 0.03, inside);

    return { model, door, M, logoMat, dims: { L, W, FLOOR, H_BACK, H_FRONT, SLOPE, yLine } };
  }

  /* Jobsite office trailer from the header photo: skirted, vertical-ribbed gray skin, arched roof, door with steps and railing,
     flood light on a riser, END USER sign. Local origin at ground center; the front face (+z) faces the pump house side. */
  function buildTrailer(THREE, opts = {}) {
    const g = new THREE.Group(); g.name = 'jobsite_trailer';
    const mx = opts.mirror ? -1 : 1;                 // mirror: door, steps, and flood light at the -x end instead of +x
    const TL = 12.2, TW = 3.05, SK = 0.9, WT = 3.4, RISE = 0.3, C = TW / 2 + 0.1, R = (C * C + RISE * RISE) / (2 * RISE);
    const T = {
      skin: mat(THREE, 'trailer_skin_gray', 0xc6c9c7, 0.6, 0.25), skirt: mat(THREE, 'trailer_skirt', 0x54585b, 0.8, 0.1), roof: mat(THREE, 'trailer_roof', 0xb5babd, 0.4, 0.5),
      white: mat(THREE, 'trailer_trim_white', 0xf0f0ed, 0.5, 0.05), glass: mat(THREE, 'trailer_glass', 0x2f3d47, 0.15, 0.4), dark: mat(THREE, 'trailer_dark', 0x2b2e31, 0.7, 0.2),
      gray: mat(THREE, 'trailer_gray', 0x8d9296, 0.55, 0.3), lens: mat(THREE, 'trailer_lamp_lens', 0xffffff, 0.3, 0), flood: mat(THREE, 'flood_lens', 0xffffff, 0.3, 0), sign: mat(THREE, 'sign_face', 0xffffff, 0.6, 0),
    };
    T.lens.emissive.set(0xe9eef7); T.flood.emissive.set(0xe9eef7);
    const { box, cyl, pipe, endPanel } = helpers(THREE, g);
    box('skirt', T.skirt, TL, SK, TW, 0, SK / 2, 0);
    for (let x = -TL / 2 + 0.3; x < TL / 2; x += 0.6) box('skirt_rib', T.dark, 0.04, SK - 0.06, 0.02, x, SK / 2, TW / 2 + 0.01);
    box('body_core', T.skin, TL - 0.04, WT - SK, TW - 0.04, 0, (WT + SK) / 2, 0);
    const skin = (name, len, ry, x, z) => { const s = corrugated(THREE, name, T.skin, len, WT - SK + 0.02, 0.18, 0.02, 0.01); s.rotation.y = ry; s.position.set(x, SK - 0.01, z); g.add(s); };
    skin('skin_front', TL, Math.PI, 0, TW / 2 - 0.012); skin('skin_back', TL, 0, 0, -TW / 2 + 0.012);
    skin('skin_end_E', TW, -Math.PI / 2, TL / 2 - 0.012, 0); skin('skin_end_W', TW, Math.PI / 2, -TL / 2 + 0.012, 0);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box('corner_trim', T.gray, 0.06, WT - SK, 0.06, sx * (TL / 2 - 0.02), (WT + SK) / 2, sz * (TW / 2 - 0.02));
    const h = Math.asin(C / R);
    const arc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, TL + 0.15, 56, 1, true, 3 * Math.PI / 2 - h, 2 * h), T.roof);
    arc.name = 'roof_arc'; arc.rotation.z = -Math.PI / 2; arc.position.set(0, WT + RISE - R, 0); arc.material.side = THREE.DoubleSide; g.add(arc);
    const capPts = [[-TW / 2, WT - 0.02], [TW / 2, WT - 0.02]];
    for (let i = 0; i <= 16; i++) { const z = TW / 2 - i * (TW / 16); capPts.push([z, WT + RISE - R + Math.sqrt(R * R - z * z)]); }
    endPanel('roof_cap_E', T.skin, capPts, 0.04, TL / 2, null); endPanel('roof_cap_W', T.skin, capPts, 0.04, -TL / 2 + 0.04, null);
    for (const sz of [-1, 1]) box('eave_trim', T.gray, TL + 0.15, 0.05, 0.08, 0, WT + 0.02, sz * (TW / 2 + 0.06));
    const win = (x, w, hgt, y) => { box('window_frame', T.white, w, hgt, 0.04, x, y, TW / 2 + 0.02); box('window_glass', T.glass, w - 0.1, hgt - 0.1, 0.02, x, y, TW / 2 + 0.035); box('window_mullion', T.white, 0.04, hgt - 0.1, 0.01, x, y, TW / 2 + 0.046); };
    win(mx * 0.7, 1.0, 0.85, 2.45); win(mx * 2.4, 1.0, 0.85, 2.45); win(mx * 5.4, 0.7, 0.7, 2.5);
    const DX = mx * 3.7, DW = 0.95, DH = 2.05;
    box('trailer_door', T.white, DW, DH, 0.05, DX, SK + DH / 2, TW / 2 + 0.025);
    box('door_glass', T.glass, 0.4, 0.55, 0.01, DX, SK + 1.55, TW / 2 + 0.055);
    box('door_handle', T.dark, 0.03, 0.12, 0.05, DX + mx * 0.38, SK + 1.0, TW / 2 + 0.07);
    cyl('door_lamp_base', T.dark, 0.06, 0.02, DX, SK + DH + 0.18, TW / 2 + 0.01, 'z'); cyl('trailer_lamp_lens', T.lens, 0.045, 0.06, DX, SK + DH + 0.18, TW / 2 + 0.05, 'z').userData.wall = 1;
    const LAND = 0.9;
    box('landing', T.dark, 1.2, 0.05, LAND, DX, SK - 0.025, TW / 2 + LAND / 2);
    for (let k = 0; k < 4; k++) box('step_tread', T.dark, 1.0, 0.04, 0.28, DX, SK - 0.2 - k * 0.2, TW / 2 + LAND + 0.15 + k * 0.28);
    for (const s of [-1, 1]) {
      const st = box('stringer', T.dark, 0.05, 0.08, 1.3, DX + s * 0.5, (SK - 0.15 + 0.1) / 2, TW / 2 + LAND + 0.56); st.rotation.x = Math.atan(0.65 / 1.12);
      cyl('rail_post', T.dark, 0.02, 1.0, DX + s * 0.58, SK + 0.5, TW / 2 + LAND - 0.05);

const dayIntensity = new Map(sceneLights.map((l) => [l, l.intensity]));
const dayBg = stage._renderer.getClearColor(new THREE.Color());
const dayBgAlpha = stage._renderer.getClearAlpha();
const nightLights = new THREE.Group(); nightLights.name = 'night_lights'; nightLights.visible = false; stage._scene.add(nightLights);
const addLamp = (x, y, z, color, intensity, dist) => { const p = new THREE.PointLight(color, intensity, dist, 2); p.position.set(x, y, z); nightLights.add(p); return p; };
model.updateMatrixWorld(true); site.updateMatrixWorld(true);
const wp = new THREE.Vector3();
model.traverse((o) => { if (o.isMesh && o.name === 'lamp_lens') { o.getWorldPosition(wp); addLamp(wp.x, wp.y - 0.1, wp.z + 0.3, 0xfff1d6, 2.5, 6); } });
if (trailer) { const fd = new THREE.Vector3();
  site.traverse((o) => {
  if (!o.isMesh || !o.userData.wall) return;
  o.getWorldPosition(wp); fd.set(0, 0, o.userData.wall).applyQuaternion(trailer.quaternion);   // the direction the lens faces
  if (o.name === 'trailer_lamp_lens') addLamp(wp.x + fd.x * 0.3, wp.y - 0.1, wp.z + fd.z * 0.3, 0xfff1d6, 1.5, 5);
  if (o.name === 'flood_lens') addLamp(wp.x + fd.x * 1.4, wp.y - 0.4, wp.z + fd.z * 1.4, 0xf3f6ff, 28, 22);
}); }
const lensMats = [...new Set([M.lens, T.lens, T.flood])];
const emissiveDay = new Map(lensMats.map((m) => [m, m.emissive.clone()]));
let night = false;
function setNight(on) {
  night = on;
  for (const l of sceneLights) l.intensity = dayIntensity.get(l) * (on ? (l.isHemisphereLight ? 0.24 : 0.16) : 1);
  if (on) { stage._key.color.set(0x8fa3c8); stage._renderer.setClearColor(0x0f1829, 1); } else { stage._key.color.set(0xffffff); stage._renderer.setClearColor(dayBg, dayBgAlpha); }
  nightLights.visible = on;
  for (const m of lensMats) { m.emissive.set(on ? 0xffffff : emissiveDay.get(m)); m.emissiveIntensity = on ? 1.15 : 1; }
}

/* ---------------- Door: click to swing, messages for the same ---------------- */
const setDoor = (open) => { door.userData.door.open = open; };
const canvas = stage._renderer.domElement;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, stage._camera);
  const hit = raycaster.intersectObject(model, true)[0];
  if (!hit) return;
  let o = hit.object;
  while (o && !o.userData.door) o = o.parent;
  if (o) { setDoor(!o.userData.door.open); report(); }
});
(function animate() {
  const d = door.userData.door, target = d.open ? d.openAngle : 0;
  d.angle += (target - d.angle) * 0.12;
  if (Math.abs(target - d.angle) < 0.002) d.angle = target;
  door.rotation.y = d.angle;
  requestAnimationFrame(animate);
})();

/* ---------------- Viewer API: camera views and messages from the host page ---------------- */
stage._toolbar.style.display = 'none';
{ const note = stage.shadowRoot && stage.shadowRoot.querySelector('.note'); if (note) note.style.display = 'none'; }
const ctrl = stage._controls, cam = stage._camera;
ctrl.autoRotate = false;
const camScale = parseFloat(new URLSearchParams(location.search).get('dist') || '1') || 1;
const VIEWS = withSite ? {
  front: () => ({ pos: [4.4, 2.1, 5.2], tgt: [0.4, 1.05, -0.5] }),
  interior: () => ({ pos: [2.75, 1.5, 0.15], tgt: [-0.4, 0.95, -0.05] }),
  trailer: () => ({ pos: [-4.6, 2.8, 4.8], tgt: [2.4, 1.3, -1.3] }),
} : {
  front: () => ({ pos: [3.9, 1.9, 4.3], tgt: [0, 1.05, 0] }),
  interior: () => ({ pos: [2.75, 1.5, 0.15], tgt: [-0.4, 0.95, -0.05] }),
  rear: () => ({ pos: [-3.4, 2.0, -4.4], tgt: [0, 1.05, 0] }),
};
let tween = null;
function goView(name, instant) {
  const v = VIEWS[name]; if (!v) return;
  const { pos: rawPos, tgt } = v();
  const pos = rawPos.map((c, i) => tgt[i] + (c - tgt[i]) * camScale);
  if (name === 'interior') { setDoor(true); report(); }
  swaying = false; ctrl.autoRotate = false;
  if (instant) { cam.position.set(...pos); ctrl.target.set(...tgt); ctrl.update(); resumeSway(); return; }
  tween = { t0: performance.now(), dur: 900, p0: cam.position.clone(), q0: ctrl.target.clone(), p1: new THREE.Vector3(...pos), q1: new THREE.Vector3(...tgt) };
}
// Idle motion is a slow sway around the current view rather than a full turntable, so the trailer never hides the pump house.
let keepRotating = true, swaying = false, swayBase = 0, swayT = 0, resumeTimer = null, lastT = performance.now();
const sphr = new THREE.Spherical(), off = new THREE.Vector3();
function resumeSway() { if (!keepRotating) return; if (!withSite) { ctrl.autoRotate = true; return; } off.copy(cam.position).sub(ctrl.target); sphr.setFromVector3(off); swayBase = sphr.theta; swayT = 0; swaying = true; }
ctrl.addEventListener('start', () => { tween = null; swaying = false; ctrl.autoRotate = false; clearTimeout(resumeTimer); });
ctrl.addEventListener('end', () => { clearTimeout(resumeTimer); resumeTimer = setTimeout(resumeSway, 2500); });
(function loop() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k;
    cam.position.lerpVectors(tween.p0, tween.p1, e); ctrl.target.lerpVectors(tween.q0, tween.q1, e); ctrl.update();
    if (k >= 1) { tween = null; resumeSway(); }
  } else if (swaying) {
    swayT += dt;
    off.copy(cam.position).sub(ctrl.target); sphr.setFromVector3(off);
    sphr.theta = swayBase + 0.5 * Math.sin(swayT * 0.22);
    off.setFromSpherical(sphr); cam.position.copy(ctrl.target).add(off); ctrl.update();
  }
  requestAnimationFrame(loop);
})();
// Start state from the URL: ?site=1&view=front|interior|rear|trailer&doors=open&rotate=0&night=1
keepRotating = qp.get('rotate') !== '0';
goView(VIEWS[qp.get('view')] ? qp.get('view') : 'front', true);
if (qp.get('doors') === 'open') setDoor(true);
if (qp.get('night') === '1') setNight(true);

function report() { parent.postMessage({ type: 'viewer-state', doorsOpen: door.userData.door.open, night }, '*'); }
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'doors') { setDoor(!!d.open); report(); }
  else if (d.type === 'night') { setNight(!!d.on); report(); }
  else if (d.type === 'view') goView(d.name, !!d.instant);
  else if (d.type === 'autorotate') { keepRotating = !!d.on; if (keepRotating) resumeSway(); else { swaying = false; ctrl.autoRotate = false; } }
});
parent.postMessage({ type: 'viewer-ready' }, '*');
</script>
</body>
</html>
