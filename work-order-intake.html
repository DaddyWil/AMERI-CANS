<script>try{var t=localStorage.getItem('ac-theme');if(t==='night')document.documentElement.setAttribute('data-theme','night')}catch(e){}</script>
<style>
:root{color-scheme:light;--navy:#012B4E;--deep-sea:#1C445B;--denim:#3E6883;--sky:#5D8FAF;--red:#B72319;--red-pale:#FBEDEC;--light:#EAF1F6;--input:#EEF4F8;--rule:#BFD0DD;--gray:#595959;--line:#B9C7D3;--page:#FFFFFF;--ink:#000000;--text:#333333;--inverse:#FFFFFF;--nav-line:#D6DFE7;--logo-tab:transparent}
html[data-theme=night]{color-scheme:dark;--navy:#FFFFFF;--deep-sea:#D6DFE7;--denim:#8FB4CC;--red:#FF6B5E;--red-pale:#3A2224;--light:#1C2C45;--input:#1C2C45;--rule:#2A3A55;--gray:#A9BCC5;--line:#2A3A55;--page:#0F1829;--ink:#E6EDF3;--text:#D6DFE7;--inverse:#0F1829;--nav-line:#22314A;--logo-tab:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;font-size:16px;line-height:1.45}
.topbar{height:4px;background:var(--navy)}
.nav{border-bottom:1px solid var(--nav-line)}
.logo-tab{display:flex;padding:6px 10px;margin:-6px -10px;background:var(--logo-tab)}
.nav-inner{max-width:480px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{height:24px;width:auto;display:block}
.nav a{font-size:14px;font-weight:700;color:var(--denim);text-decoration:none}
.nav a:hover{color:var(--navy)}
main{max-width:480px;margin:0 auto;padding:48px 20px 64px}
html.haskey main{visibility:hidden}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--denim)}
h1{margin:10px 0 0;font-size:28px;line-height:1.1;letter-spacing:-.01em;color:var(--navy)}
p{margin:14px 0 0;color:var(--text)}
form{margin-top:28px;display:grid;gap:14px}
.lbl{display:grid;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--denim)}
input[type=password]{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--input);border-radius:0;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
.opt{position:relative;display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer;user-select:none}
.opt input{position:absolute;opacity:0;width:0;height:0;margin:0}
.bx{width:18px;height:18px;border:1.5px solid var(--sky);background:var(--input);position:relative;flex:none}
.opt input:checked+.bx{background:var(--navy);border-color:var(--navy)}
.opt input:checked+.bx::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--inverse);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt input:focus-visible+.bx{outline:3px solid var(--sky);outline-offset:1px}
button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 20px;border:1px solid var(--navy);background:var(--navy);color:var(--inverse);border-radius:0;cursor:pointer;justify-self:start}
button:hover{background:var(--deep-sea)}
button:disabled{opacity:.45;cursor:default}
.err{display:none;border-left:4px solid var(--red);background:var(--red-pale);padding:10px 14px;font-size:14px;color:var(--ink)}
.err b{color:var(--red)}
.err.show{display:block}
.foot{margin-top:40px;font-size:12px;color:var(--gray);line-height:1.6}
</style>
<script src="wash.js" defer></script>
