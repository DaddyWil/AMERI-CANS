    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",

<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }

<body>
<three-d-stage name="mark-iv" background="#ffffff" autorotate></three-d-stage>
<script>
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
// Copied omelette starter. Re-running copy_starter_component with this kind overwrites this file with the latest version (page content is unaffected).
/* BEGIN USAGE */
/**
 * <three-d-stage> — 3D object viewer + exporter shell (three.js).
 *
 * The stage owns the whole scene: WebGL renderer, neutral studio lighting
 * with a soft ground shadow, orbit controls (drag to orbit, wheel to zoom,
 * right-drag to pan), a camera auto-framed to the object's bounds, resize
 * handling, and a download toolbar that exports the current object as
 * OBJ + MTL or GLB (binary glTF). FBX cannot be exported in the browser;
 * GLB is the interchange format every modern 3D tool imports.
 *
 * three.js loads through the page's import map. Include this EXACT pinned
 * map in <head>, before any module runs — versions and integrity hashes
 * stay together (same map the "3D object" skill mandates):
 *
 *   <script type="importmap">
 *   {
 *     "imports": {
 *       "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
 *       "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 *       "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
 *       "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
 *     },
 *     "integrity": {
 *       "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
 *       "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
 *     }
 *   }
 *   <\/script>
 *
 * Usage:
 *   <style>three-d-stage:not(:defined){visibility:hidden}</style>
 *   <three-d-stage name="rocket"></three-d-stage>
 *   <script src="three-d-stage.js"><\/script>
 *   <script type="module">
 *     const stage = document.querySelector('three-d-stage');
 *     const { THREE } = await stage.ready;
 *     const model = new THREE.Group();
 *     // …build the model out of named meshes with named materials —
 *     // the names become the o / usemtl entries in the exported OBJ…
 *     stage.setObject(model);
 *   <\/script>
 *
 * Attributes:
 *   name       — export file basename (default "model")
 *   background — CSS color behind the scene (default a warm paper tone)
 *   autorotate — when present, a slow turntable until the user interacts
 *
 * Model in real-world meters, centered on the origin, y-up — exports
 * inherit the scene's units and orientation. The stage fills its own box;
 * size it with ordinary CSS (default 100vw/100vh page hero).
 *
 * Default setup: neutral studio lighting (hemisphere + key + fill), a
 * soft ground shadow, and NO environment map — so high metalness has
 * nothing to reflect and renders near-black. Cap metalness around
 * 0.3–0.4 and carry a metal look with a brighter base color. The copied
 * file is yours: adjust the lights, shadow, or background in _boot()
 * when the object needs a different look.
 */
/* END USAGE */

(() => {
  const stylesheet = `
    :host {
      position: relative;
      display: block;
      width: 100%;
      height: 100vh;
      background: var(--stage-bg, #f0eee6);
      overflow: hidden;
    }
    canvas { display: block; outline: none; }
    .toolbar {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .toolbar button {
      appearance: none;
      border: 1px solid rgba(20, 20, 19, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #1a1915;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 12px;
      cursor: default;
    }
    .toolbar button:hover { background: #fff; }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar button[disabled] { opacity: 0.5; pointer-events: none; }
    .note {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: 60%;
      font: 400 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: rgba(26, 25, 21, 0.55);
      user-select: none;
    }
    .err {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 500 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8a2f20;
      text-align: center;
      white-space: pre-line;
    }
  `;

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /** Tell the host an export attempt settled — telemetry only. The host
   *  (HTMLViewer) verifies the source and re-reads these fields defensively
   *  before counting; nothing else crosses the frame boundary. Guarded so
   *  telemetry can never break the download path. */
  function notifyExport(format, ok) {
    try {
      window.parent.postMessage(
        { type: 'omelette:notify-3d-export', format: format, ok: ok === true },
        '*'
      );
    } catch (e) {}
  }

  class ThreeDStage extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      const style = document.createElement('style');
      style.textContent = stylesheet;
      root.appendChild(style);
      this._err = document.createElement('div');
      this._err.className = 'err';
      root.appendChild(this._err);
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'Drag to orbit · scroll to zoom · right-drag to pan';
      root.appendChild(note);
      this._toolbar = document.createElement('div');
      this._toolbar.className = 'toolbar';
      this._objBtn = document.createElement('button');
      this._objBtn.type = 'button';
      this._objBtn.textContent = 'Download OBJ + MTL';
      this._objBtn.addEventListener('click', () => this._runExport('obj'));
      this._glbBtn = document.createElement('button');
      this._glbBtn.type = 'button';
      this._glbBtn.textContent = 'Download GLB';
      this._glbBtn.addEventListener('click', () => this._runExport('glb'));
      this._toolbar.appendChild(this._objBtn);
      this._toolbar.appendChild(this._glbBtn);
      root.appendChild(this._toolbar);
      this._setButtonsEnabled(false);
      /** Resolves with { THREE } once the scene is live — build the model
       *  in `await stage.ready` so nothing races the library load. */
      this.ready = new Promise((resolve, reject) => {
        this._readyResolve = resolve;
        this._readyReject = reject;
      });
    }

    connectedCallback() {
      if (this._booted) {
        // Re-attached after a removal — resume what disconnected stopped.
        if (this._renderer) {
          this._renderer.setAnimationLoop(this._loop);
          this._ro && this._ro.observe(this);
        }
        return;
      }
      this._booted = true;
      this._boot().catch((err) => {
        this._err.style.display = 'flex';
        this._err.textContent =
          'three.js failed to load.\n' +
          'Check that the pinned <script type="importmap"> from the usage ' +
          'notes is in <head> before any module script.\n\n' +
          String(err && err.message ? err.message : err);
        this._readyReject(err);
      });
    }

    async _boot() {
      const bg = this.getAttribute('background');
      if (bg) this.style.setProperty('--stage-bg', bg);
      const [THREE, controlsMod] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
      ]);
      this._THREE = THREE;
      // preserveDrawingBuffer keeps the last frame readable after
      // compositing (toDataURL / drawImage) — it's what lets the
      // screenshot tools capture the scene instead of a blank canvas.
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      this._renderer = renderer;
      this.shadowRoot.insertBefore(renderer.domElement, this._err);

      const scene = new THREE.Scene();
      this._scene = scene;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 500);
      camera.position.set(3, 2.2, 4);
      this._camera = camera;

      const controls = new controlsMod.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      this._controls = controls;

      // Neutral studio: soft sky/ground wash, a shadow-casting key light,
      // and a dim fill from behind so silhouettes never go black.
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 1.0));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(4, 7, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0002;
      this._key = key;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xfff4e6, 0.5);
      fill.position.set(-5, 3, -4);
      scene.add(fill);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      this._ground = ground;
      scene.add(ground);

      this._autorotate = this.hasAttribute('autorotate');
      controls.autoRotate = this._autorotate;
      controls.autoRotateSpeed = 1.2;
      controls.addEventListener('start', () => {
        controls.autoRotate = false;
      });

      const fit = () => {
        const w = this.clientWidth || 1;
        const h = this.clientHeight || 1;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      fit();
      this._ro = new ResizeObserver(fit);
      this._loop = () => {
        controls.update();
        renderer.render(scene, camera);
      };
      // Detached while three.js was fetching? Stay idle — the
      // connectedCallback resume starts the loop and observer on
      // reattach.
      if (this.isConnected) {
        this._ro.observe(this);
        renderer.setAnimationLoop(this._loop);
      }

      this._readyResolve({ THREE });
    }

    disconnectedCallback() {
      // Stop rendering and observing while detached; connectedCallback
      // resumes both. (The renderer itself is kept — a move within the
      // document must not rebuild the scene.)
      if (this._renderer) this._renderer.setAnimationLoop(null);
      if (this._ro) this._ro.disconnect();
    }

    /** Show (and own) the object. Replaces any previous object, enables
     *  shadows on every mesh, rests it on the ground plane, and frames
     *  the camera to its bounds. */
    setObject(object) {
      const THREE = this._THREE;
      if (!THREE) throw new Error('three-d-stage: not ready — await stage.ready first');
      if (this._object) this._scene.remove(this._object);
      this._object = object;
      object.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      const box = new THREE.Box3().setFromObject(object);
      if (!box.isEmpty()) {
        // Rest the object on the ground without moving its origin.
        this._ground.position.y = box.min.y;
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const dist =
          (sphere.radius / Math.tan((this._camera.fov * Math.PI) / 360)) * 1.35;
        const dir = new THREE.Vector3(1, 0.55, 1.25).normalize();
        this._camera.position
          .copy(sphere.center)
          .add(dir.multiplyScalar(dist));
        this._camera.near = Math.max(dist / 100, 0.01);
        this._camera.far = dist * 100;
        this._camera.updateProjectionMatrix();
        this._controls.target.copy(sphere.center);
        this._controls.update();
        const span = sphere.radius * 3;
        this._key.shadow.camera.left = -span;
        this._key.shadow.camera.right = span;
        this._key.shadow.camera.top = span;
        this._key.shadow.camera.bottom = -span;
        this._key.shadow.camera.updateProjectionMatrix();
      }
      this._scene.add(object);
      this._setButtonsEnabled(true);
    }

    get _basename() {
      return (this.getAttribute('name') || 'model').replace(/[^\w.-]+/g, '_');
    }

    _setButtonsEnabled(on) {
      this._objBtn.disabled = !on;
      this._glbBtn.disabled = !on;
    }

    /** Every mesh and material needs a unique name for o/usemtl lines —
     *  fill in stable fallbacks, and return the unique material list. */
    _nameParts() {
      const mats = [];
      const seen = new Set();
      let meshI = 0;
      let matI = 0;
      this._object.traverse((o) => {
        if (!o.isMesh) return;
        if (!o.name) o.name = 'part_' + meshI;
        meshI += 1;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of list) {
          if (!m || mats.includes(m)) continue;
          if (!m.name) {
            m.name = 'mat_' + matI;
            matI += 1;
          }
          while (seen.has(m.name)) {
            m.name = m.name + '_' + matI;
            matI += 1;
          }
          seen.add(m.name);
          mats.push(m);
        }
      });
      return mats;
    }

    /** One export attempt, reported to the host however it settles.
     *  Rethrows so a failure stays visible on the guest console exactly as
     *  before. The no-object early return is not an attempt (the toolbar is
     *  disabled until the model loads) and reports nothing. */
    async _runExport(format) {
      if (!this._object) return;
      try {
        await (format === 'obj' ? this._exportObj() : this._exportGlb());
        notifyExport(format, true);
      } catch (err) {
        notifyExport(format, false);
        throw err;
      }
    }

    async _exportObj() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/OBJExporter.js');
      const mats = this._nameParts();
      const base = this._basename;
      const obj =
        'mtllib ' + base + '.mtl\n' + new mod.OBJExporter().parse(this._object);
      let mtl = '# Exported by three-d-stage\n';
      for (const m of mats) {
        const c = m.color || { r: 0.8, g: 0.8, b: 0.8 };
        const rough = typeof m.roughness === 'number' ? m.roughness : 0.5;
        const opacity = typeof m.opacity === 'number' ? m.opacity : 1;
        mtl += 'newmtl ' + m.name + '\n';
        mtl +=
          'Kd ' + c.r.toFixed(4) + ' ' + c.g.toFixed(4) + ' ' + c.b.toFixed(4) + '\n';
        mtl += 'Ks 0.2000 0.2000 0.2000\n';
        mtl += 'Ns ' + Math.round((1 - rough) * 200) + '\n';
        mtl += 'd ' + opacity.toFixed(4) + '\n\n';
      }
      download(new Blob([obj], { type: 'text/plain' }), base + '.obj');
      download(new Blob([mtl], { type: 'text/plain' }), base + '.mtl');
    }

    async _exportGlb() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/GLTFExporter.js');
      this._nameParts();
      const base = this._basename;
      const buf = await new mod.GLTFExporter().parseAsync(this._object, {
        binary: true,
      });
      download(
        new Blob([buf], { type: 'model/gltf-binary' }),
        base + '.glb'
      );
    }
  }

  customElements.define('three-d-stage', ThreeDStage);
})();

</script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

// 40 ft high-cube ISO container, meters, y-up. +z = stall side (front), +x = HVAC end, -x = cargo-door end.
const L = 12.192, W = 2.438, H = 2.896;
const P = 0.16, RT = 0.15, RB = 0.2;          // corner post section, top rail, bottom rail
const IL = L - 2 * P, IW = W - 2 * P;         // clear length / width between posts
const Y0 = RB, Y1 = H - RT, WH = Y1 - Y0;     // wall band
const YM = (Y0 + Y1) / 2;

const mat = (name, color, roughness, metalness) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness, metalness });
  m.name = name;
  return m;
};
const M = {
  blue:  mat('container_blue', 0x1e4fc5, 0.5, 0.25),
  white: mat('stall_white',    0xf1f2ef, 0.45, 0.05),
  steel: mat('stainless',      0xc9ced2, 0.3, 0.35),
  beige: mat('hvac_beige',     0xe6e2d6, 0.55, 0.1),
  gray:  mat('panel_gray',     0x9ea4a8, 0.5, 0.3),
  black: mat('rubber_black',   0x1c1d1f, 0.85, 0.05),
  iwhite: mat('interior_white', 0xf4f5f3, 0.35, 0.05),
  floor: mat('floor_gray',      0x6b6f75, 0.9, 0.0),
  foam:  mat('spray_foam',      0xcfe3d8, 1.0, 0.0),
  strap: mat('ratchet_strap',   0xd8e84a, 0.8, 0.0),
  pex:   mat('pex_red',         0xc0392b, 0.6, 0.0),
};
M.foam.emissive.set(0x1c2a24);
// Interior materials: the stalls only get ambient light, so emissive lifts them to the bright FRP white of the photos
M.iwhite.color.set(0xf7f8f6); M.iwhite.roughness = 0.2; M.iwhite.emissive.set(0x9a9a9a);
M.floor.color.set(0x74787d); M.floor.emissive.set(0x34383d);
M.isteel = mat('interior_stainless', 0xd2d6da, 0.3, 0.35); M.isteel.emissive.set(0x7c8084);
M.igray = mat('interior_gray', 0xb4b8bc, 0.5, 0.2); M.igray.emissive.set(0x62666a);
M.mirror = mat('mirror_glass', 0xdbe7ed, 0.05, 0.5); M.mirror.emissive.set(0xa9bcc5);
M.led = mat('led_lens_white', 0xffffff, 0.3, 0); M.led.emissive.set(0xe6eeff);
M.green = mat('exit_button_green', 0x2fbf5a, 0.5, 0); M.green.emissive.set(0x1f7f3c);
// Exterior stall module: light gray FRP panel, slightly whiter doors, bright aluminum angle trim
M.panel = mat('stall_panel_gray', 0xe3e6e6, 0.35, 0.15);
M.door = mat('stall_door_white', 0xeff1ef, 0.4, 0.08);
M.alu = mat('aluminum_trim', 0xdfe3e7, 0.25, 0.6);
M.seam = mat('panel_seam', 0xc9cdcd, 0.5, 0.1);
M.mesh = (() => {   // expanded-metal grate: opaque strands, transparent diamonds, tiled
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#202224'; ctx.fillRect(0, 0, 128, 128);
  ctx.globalCompositeOperation = 'destination-out';
  const dia = (px, py) => { ctx.beginPath(); ctx.moveTo(px, py - 26); ctx.lineTo(px + 46, py); ctx.lineTo(px, py + 26); ctx.lineTo(px - 46, py); ctx.closePath(); ctx.fill(); };
  dia(64, 64); dia(0, 0); dia(128, 0); dia(0, 128); dia(128, 128);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 9); t.anisotropy = 8;
  const m = new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.8, metalness: 0.4 });
  m.name = 'expanded_metal'; return m;
})();

const model = new THREE.Group();
model.name = 'mark_iv_seacan';

const grp = (name, parent = model) => { const g = new THREE.Group(); g.name = name; parent.add(g); return g; };
const box = (name, m, w, h, d, x, y, z, parent = model) => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.name = name; mesh.position.set(x, y, z); parent.add(mesh); return mesh;
};
const cyl = (name, m, r, len, x, y, z, axis = 'y', parent = model, seg = 24) => {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  if (axis === 'x') mesh.rotation.z = Math.PI / 2;
  if (axis === 'z') mesh.rotation.x = Math.PI / 2;
  mesh.name = name; mesh.position.set(x, y, z); parent.add(mesh); return mesh;
};

// Trapezoidal corrugated sheet. Local: length along x (centered), height along +y from 0,
// outer flats at z = 0, recesses toward +z. Rotate about y to face other directions.
function corrugated(name, m, length, height, pitchTarget = 0.21, depth = 0.036, thick = 0.016) {
  const n = Math.max(1, Math.round(length / pitchTarget));
  const pitch = length / n, flat = pitch * 0.34, slope = (pitch - 2 * flat) / 2;
  const pts = [[0, 0]];
  let x = 0;
  for (let i = 0; i < n; i++) {
    x += flat;  pts.push([x, 0]);
    x += slope; pts.push([x, -depth]);
    x += flat;  pts.push([x, -depth]);
    x += slope; pts.push([x, 0]);
  }
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  for (let i = pts.length - 1; i >= 0; i--) s.lineTo(pts[i][0], pts[i][1] - thick);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: height, bevelEnabled: false, steps: 1 });
  g.translate(-length / 2, 0, 0);
  g.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(g, m);
  mesh.name = name;
  return mesh;
}

// Door signs: canvas-drawn pictogram plaques (carry into the GLB export as textures)
const signMats = {};
function signMaterial(label) {
  if (signMats[label]) return signMats[label];
  const c = document.createElement('canvas'); c.width = 240; c.height = 304;
  const x = c.getContext('2d');
  x.fillStyle = '#1c1d1f'; x.fillRect(0, 0, 240, 304);
  x.fillStyle = '#ffffff';
  x.beginPath(); x.arc(120, 62, 22, 0, Math.PI * 2); x.fill();
  if (label === 'WOMEN') {
    x.beginPath(); x.moveTo(104, 92); x.lineTo(136, 92); x.lineTo(166, 186); x.lineTo(74, 186); x.closePath(); x.fill();
    x.fillRect(102, 186, 14, 40); x.fillRect(124, 186, 14, 40);
  } else {
    x.beginPath(); x.roundRect(86, 92, 68, 84, 10); x.fill();
    x.fillRect(96, 174, 20, 52); x.fillRect(124, 174, 20, 52);
  }
  x.font = 'bold 52px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 120, 266);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0 });
  m.name = 'sign_' + label.toLowerCase();
  return (signMats[label] = m);
}

  for (const e of [-1, 1]) box('leaf_frame_side', M.blue, 0.03, leafH, 0.08, 0.003, YM, zc + e * (leafLen / 2 - 0.04), pivot);
  box('leaf_inner_skin', M.blue, 0.012, leafH - 0.02, leafLen - 0.02, 0.058, YM, zc, pivot);
  for (const y of [0.5, 1.2, 1.9, 2.5]) box('door_hinge', M.steel, 0.06, 0.14, 0.05, -0.018, y, s * 0.005, pivot);
  for (const zb of [0.3, 0.72]) {
    const z = -s * zb;
    const bar = grp('lock_bar_assembly', pivot);
    cyl('lock_bar', M.steel, 0.018, WH - 0.2, -0.06, YM, z, 'y', bar);
    for (const y of [0.5, 1.45, 2.45]) box('bar_bracket', M.steel, 0.05, 0.06, 0.07, -0.03, y, z, bar);
    box('bar_cam_top', M.steel, 0.07, 0.07, 0.06, -0.05, Y1 - 0.065, z, bar);
    box('bar_cam_bottom', M.steel, 0.07, 0.07, 0.06, -0.05, Y0 + 0.07, z, bar);
    box('bar_handle', M.steel, 0.035, 0.035, 0.3, -0.085, 1.05, z + s * 0.15, bar);
    box('handle_keeper', M.steel, 0.03, 0.1, 0.05, -0.03, 1.05, z + s * 0.3, bar);
  }
  if (s < 0) box('csc_plate', M.gray, 0.006, 0.15, 0.2, -0.015, 0.55, 0.55, pivot);
  cargoDoors.push(pivot);
}

// Mechanical room behind the doors (viewed from the doors: tank right, electrical wall left)
const mech = grp('mechanical_room', doorEnd);
const MX0 = XD + P, MX1 = MECH_X1, ML = MX1 - MX0;
const MZ0 = -IW / 2 + 0.02, MZ1 = IW / 2 - 0.02;
box('mech_deck', M.black, MX1 - XD - 0.13, 0.03, IW, (XD + 0.13 + MX1) / 2, Y0 + 0.015, 0, mech);
box('mech_ceiling', M.foam, MX1 - XD - 0.11, 0.05, IW, (XD + 0.11 + MX1) / 2, Y1 - 0.025, 0, mech);
box('mech_wall_front', M.foam, ML, WH, 0.05, (MX0 + MX1) / 2, YM, MZ1 - 0.02, mech);
box('mech_wall_back', M.foam, ML, WH, 0.05, (MX0 + MX1) / 2, YM, MZ0 + 0.02, mech);
box('mech_wall_inner', M.foam, 0.05, WH, IW, MX1 - 0.03, YM, 0, mech);
cyl('mech_vent', M.steel, 0.09, 0.01, MX1 - 0.06, Y0 + 2.05, 0.8, 'x', mech);
// 1000 gal fresh water tank, strapped to the wall
const tank = new THREE.Group(); tank.name = 'water_tank'; tank.position.set(MX0 + 0.85, 0, 0.27); mech.add(tank);
cyl('tank_body', M.iwhite, 0.7, 1.7, 0, Y0 + 0.88, 0, 'y', tank, 40);
const dome = new THREE.Mesh(new THREE.SphereGeometry(0.7, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.iwhite);
dome.name = 'tank_dome'; dome.scale.set(1, 0.32, 1); dome.position.set(0, Y0 + 1.73, 0); tank.add(dome);
cyl('tank_lid', M.black, 0.16, 0.06, 0, Y0 + 1.95, 0, 'y', tank);
for (const y of [0.55, 1.35]) cyl('tank_strap', M.strap, 0.715, 0.05, 0, Y0 + y, 0, 'y', tank, 40);
// Electrical wall (left, -z)
const ZW = MZ0 + 0.05;
box('main_panel', M.gray, 0.36, 0.75, 0.1, MX0 + 0.45, Y0 + 1.55, ZW + 0.05, mech);
box('transformer', M.gray, 0.25, 0.3, 0.14, MX0 + 0.3, Y0 + 2.2, ZW + 0.07, mech);
box('control_box', M.iwhite, 0.3, 0.32, 0.14, MX0 + 0.85, Y0 + 1.75, ZW + 0.07, mech);
box('breaker_strip', M.iwhite, 0.28, 0.55, 0.1, MX0 + 0.35, Y0 + 0.95, ZW + 0.05, mech);
for (let i = 0; i < 6; i++) cyl('camlock_receptacle', M.black, 0.035, 0.06, MX0 + 0.3, Y0 + 0.18 + i * 0.09, ZW + 0.03, 'z', mech);
box('water_heater', M.iwhite, 0.5, 0.45, 0.55, MX0 + 1.15, Y0 + 0.255, ZW + 0.3, mech);
cyl('pvc_riser', M.iwhite, 0.025, 1.2, MX0 + 1.3, Y0 + 0.63, ZW + 0.15, 'y', mech);
cyl('pvc_run', M.iwhite, 0.025, 0.6, MX0 + 1.3, Y0 + 1.22, ZW + 0.45, 'z', mech);
cyl('pex_hot', M.pex, 0.012, 1.3, MX0 + 1.42, Y0 + 0.9, ZW + 0.25, 'y', mech);
cyl('conduit_run', M.gray, 0.02, ML - 0.2, (MX0 + MX1) / 2, Y1 - 0.1, ZW + 0.1, 'x', mech);
cyl('flex_duct', M.gray, 0.08, 0.6, MX0 + 0.9, Y1 - 0.3, ZW + 0.22, 'x', mech);

/* ---------------- Roof fittings ---------------- */
const roof = grp('roof_fittings');
for (const [x, i] of [[-3.65, 1], [-3.95, 2]]) {
  // straight PVC stacks on the outside of the back wall: bracketed to the top rail, one third of the pipe above the roof line
  const zc = -W / 2 - 0.075;
  cyl(`vent_pipe_${i}`, M.white, 0.05, 0.42, x, H - 0.015, zc, 'y', roof);
  cyl(`vent_cap_${i}`, M.white, 0.05, 0.02, x, H + 0.2, zc, 'y', roof);
  box(`vent_bracket_${i}`, M.steel, 0.14, 0.03, 0.09, x, H - RT - 0.03, -W / 2 - 0.045, roof);
  cyl(`vent_saddle_${i}`, M.steel, 0.058, 0.03, x, H - RT - 0.03, zc, 'y', roof);
}

stage.setObject(model);

/* ---------------- Day / night ---------------- */
// Daylight: the stage's own lights. Night: those dim to moonlight, LED lenses go emissive,
// and point lights are added at each exterior fixture and in every stall.
const sceneLights = stage._scene.children.filter((o) => o.isLight);
const dayIntensity = new Map(sceneLights.map((l) => [l, l.intensity]));
const dayBg = stage._renderer.getClearColor(new THREE.Color());
const dayBgAlpha = stage._renderer.getClearAlpha();
const nightLights = new THREE.Group(); nightLights.name = 'night_lights'; nightLights.visible = false; stage._scene.add(nightLights);
const addLamp = (x, y, z, color, intensity, dist) => { const p = new THREE.PointLight(color, intensity, dist, 2); p.position.set(x, y, z); nightLights.add(p); return p; };
model.updateMatrixWorld(true);
const wp = new THREE.Vector3();
model.traverse((o) => {
  if (!o.isMesh) return;
  o.getWorldPosition(wp);
  const inside = Math.abs(wp.z) < W / 2 - 0.05 && Math.abs(wp.x) < L / 2 - 0.05;
  if (o.name === 'led_lens' && !inside) {
    // exterior fixtures: back wall bars face -z, front header lights +z, HVAC-end light +x
    const dir = wp.z < -1 ? [0, -0.3] : wp.x > L / 2 - 0.1 ? [0.3, 0] : [0, 0.3];
    addLamp(wp.x + dir[0], wp.y - 0.1, wp.z + dir[1], 0xdfe8ff, 5, 6);
  }
  // stall lamps: short range so they light the room without bleeding through the walls
  if (o.name === 'ceiling_light') addLamp(wp.x, wp.y - 0.2, wp.z, 0xf2f4ff, 1.6, 1.4);
  if (o.name === 'led_lens' && inside) addLamp(wp.x, wp.y - 0.1, wp.z + 0.1, 0xe8eeff, 0.8, 1.1);
});
const emissiveDay = new Map([[M.led, M.led.emissive.clone()], [M.iwhite, M.iwhite.emissive.clone()], [M.isteel, M.isteel.emissive.clone()], [M.igray, M.igray.emissive.clone()], [M.mirror, M.mirror.emissive.clone()], [M.floor, M.floor.emissive.clone()]]);
let night = false;
function setNight(on) {
  night = on;
  for (const l of sceneLights) l.intensity = dayIntensity.get(l) * (on ? (l.isHemisphereLight ? 0.24 : 0.16) : 1);
  if (on) { stage._key.color.set(0x8fa3c8); stage._renderer.setClearColor(0x0f1829, 1); } else { stage._key.color.set(0xffffff); stage._renderer.setClearColor(dayBg, dayBgAlpha); }
  nightLights.visible = on;
  M.led.emissive.set(on ? 0xffffff : emissiveDay.get(M.led)); M.led.emissiveIntensity = on ? 1.6 : 1;
  // stall interiors are lit by their own lamps at night, so drop the daytime emissive lift
  for (const m of [M.iwhite, M.isteel, M.igray, M.mirror, M.floor]) m.emissive.copy(emissiveDay.get(m)).multiplyScalar(on ? 0.35 : 1);
}

/* ---------------- Doors: click to swing, buttons for all ---------------- */
const OPEN_ANGLE = Math.PI * 0.53;
const setDoor = (p, open) => { p.userData.door.open = open; };
const setAll = (open) => [...doors, ...cargoDoors].forEach((p) => setDoor(p, open));

const canvas = stage._renderer.domElement;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return;                       // a drag, not a click
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, stage._camera);
  const hit = raycaster.intersectObject(model, true)[0];
  if (!hit) return;
  let o = hit.object;
  while (o && !o.userData.door) o = o.parent;
  if (o) setDoor(o, !o.userData.door.open);
});

(function animate() {
  for (const p of [...doors, ...cargoDoors]) {
    const d = p.userData.door, target = d.open ? (d.openAngle ?? OPEN_ANGLE) : 0;
    d.angle += (target - d.angle) * 0.12;
    if (Math.abs(target - d.angle) < 0.002) d.angle = target;
    p.rotation.y = d.angle * (d.dir ?? 1);
  }
  requestAnimationFrame(animate);
})();

/* ---------------- Viewer API: camera views and messages from the host page ---------------- */
stage._toolbar.style.display = 'none';
{ const note = stage.shadowRoot && stage.shadowRoot.querySelector('.note'); if (note) note.style.display = 'none'; }
const ctrl = stage._controls, cam = stage._camera;
// ?dist=1.3 pulls every preset camera back for small embeds
const camScale = parseFloat(new URLSearchParams(location.search).get('dist') || '1') || 1;
const VIEWS = {
  front: () => ({ pos: [-4.8, 2.7, 11.2], tgt: [0, 1.3, 0] }),
  rear: () => ({ pos: [3.6, 2.7, -11.2], tgt: [0, 1.3, 0] }),
  interior: () => { const s = doorX[6]; return { pos: [s.cx + 0.1, 1.55, 2.7], tgt: [s.cx, 1.1, -0.9] }; },
  mechanical: () => ({ pos: [-13, 2.6, -4], tgt: [-5.6, 1.4, 0] }),
};
let tween = null;
function goView(name, instant) {
  const v = VIEWS[name]; if (!v) return;
  const { pos: rawPos, tgt } = v();
  const pos = rawPos.map((c, i) => tgt[i] + (c - tgt[i]) * camScale);
  if (name === 'interior') setDoor(doors[6], true);
  if (name === 'mechanical') { setDoor(cargoDoors[0], true); setDoor(cargoDoors[1], true); }
  ctrl.autoRotate = false;
  if (instant) { cam.position.set(...pos); ctrl.target.set(...tgt); ctrl.update(); if (keepRotating) ctrl.autoRotate = true; return; }
  tween = { t0: performance.now(), dur: 900, p0: cam.position.clone(), q0: ctrl.target.clone(), p1: new THREE.Vector3(...pos), q1: new THREE.Vector3(...tgt) };
}
let keepRotating = true, resumeTimer = null;
ctrl.addEventListener('start', () => { tween = null; clearTimeout(resumeTimer); });
ctrl.addEventListener('end', () => { clearTimeout(resumeTimer); if (keepRotating) resumeTimer = setTimeout(() => { ctrl.autoRotate = true; }, 2500); });
(function tweenLoop() {
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.t0) / tween.dur), e = k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k;
    cam.position.lerpVectors(tween.p0, tween.p1, e); ctrl.target.lerpVectors(tween.q0, tween.q1, e); ctrl.update();
    if (k >= 1) { tween = null; if (keepRotating) ctrl.autoRotate = true; }
  }
  requestAnimationFrame(tweenLoop);
})();
// Start state from the URL: ?view=front|rear|interior|mechanical&doors=open&rotate=0&night=1
const qp = new URLSearchParams(location.search);
goView(VIEWS[qp.get('view')] ? qp.get('view') : 'front', true);
if (qp.get('doors') === 'open') setAll(true);
if (qp.get('night') === '1') setNight(true);
keepRotating = qp.get('rotate') !== '0';
ctrl.autoRotate = keepRotating;

const report = () => parent.postMessage({ type: 'viewer-state', doorsOpen: doors.every((p) => p.userData.door.open), night }, '*');
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'doors') { setAll(!!d.open); report(); }
  else if (d.type === 'night') { setNight(!!d.on); report(); }
  else if (d.type === 'view') goView(d.name, !!d.instant);
  else if (d.type === 'autorotate') { keepRotating = !!d.on; ctrl.autoRotate = keepRotating; }
});
parent.postMessage({ type: 'viewer-ready' }, '*');
</script>
</body>
</html>
