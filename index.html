    if (lower === 'clear' || lower === 'cls') { this.setState({ lines: [], tail: [] }); return; }
    if (lower === 'pwd') { this.out('/home/whans'); return; }
    if (lower === 'date') { this.out(new Date().toString()); return; }
    if (lower === 'exit' || lower === 'logout') { this.out('logout', 'dim'); return; }
    this.out('bash: ' + cmd + ': command not found. Type help.', 'err');
  }
  renderVals() {
    const s = this.state;
    const row = (i) => {
      const on = s.sel === i, shown = s.menu > i;
      return { display: shown ? 'flex' : 'none', bg: on ? '#cccccc' : 'transparent', fg: on ? '#0c0c0c' : '#cccccc', numColor: on ? '#0c0c0c' : '#8a8a8a', descColor: on ? '#2a2a2a' : '#8a8a8a',
        click: (e) => { e.preventDefault(); if (!this.state.ready) this.skip(); this.open(i); }, hover: () => { if (this.state.sel !== i) this.setState({ sel: i }); } };
    };
    return {
      lines: s.lines, tail: s.tail, typed: s.typed, bodyRef: this.bodyRef, inputRef: this.inputRef,
      m0: row(0), m1: row(1), m2: row(2), m3: row(3),
      promptDisplay: s.ready ? 'flex' : 'none', booting: !s.ready,
      focusInput: (e) => { if (e.target.closest && e.target.closest('a, button, input')) return; if (!this.state.ready) { this.skip(); return; } const i = this.inputRef.current; if (i) i.focus({ preventScroll: true }); },
      onType: (e) => this.setState({ typed: e.target.value }),
      onKey: (e) => {
        const n = this.ITEMS.length;
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState((st) => ({ sel: (st.sel + 1) % n })); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState((st) => ({ sel: (st.sel + n - 1) % n })); }
        else if (e.key === 'Escape') { this.setState({ typed: '' }); }
        else if (/^[1-9]$/.test(e.key) && !this.state.typed) { e.preventDefault(); const i = Number(e.key) - 1; if (this.ITEMS[i]) { this.out(e.key, 'cmd'); this.open(i); } }
      },
      submit: (e) => { e.preventDefault(); const t = this.state.typed; this.setState({ typed: '' }); if (t.trim()) this.run(t); else { this.out('', 'cmd'); this.open(this.state.sel); } },
    };
  }
}
</script>
