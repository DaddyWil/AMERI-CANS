<style>
/* Billy's business card. Everything needed to read it and use it is in this one file: the photo, the logo, the buttons, the QR.
   The card is a pane of glass: see-through, with what is behind it blurred, a bright top edge and a soft shadow. Corners stay square, as everywhere on the site.
   It opens in Night. That is the card's own default (data-theme on <html>, and its own saved choice, ac-card-theme), not the site's.
   wash.js follows on its own and adds the site's look: the faded service flags drifting behind the page (stars and stripes at night),
   Archivo, the hover lift and the Night and Daylight crossfade. The card works before it arrives and without it. */
:root{--page:#E3ECF3;--ink:#012B4E;--muted:#3E6883;--inverse:#FFFFFF;--solid:#012B4E;
  --glass:rgba(255,255,255,.5);--glass-flat:rgba(255,255,255,.9);--edge:rgba(255,255,255,.95);--hair:rgba(1,43,78,.13);--line:rgba(1,43,78,.3);--tile:rgba(255,255,255,.42);
  --lift:0 34px 60px -34px rgba(1,43,78,.5),0 2px 10px -4px rgba(1,43,78,.18);--shine:rgba(255,255,255,.75);--chip:rgba(255,255,255,.6);--chip-ink:#012B4E;--tab:transparent;--tab-pad:0}
html[data-theme=night]{color-scheme:dark;--page:#0F1829;--ink:#FFFFFF;--muted:#B4CBDB;--inverse:#0F1829;--solid:rgba(255,255,255,.94);
  --glass:rgba(255,255,255,.085);--glass-flat:rgba(21,32,54,.96);--edge:rgba(255,255,255,.34);--hair:rgba(255,255,255,.14);--line:rgba(255,255,255,.32);--tile:rgba(255,255,255,.07);
  --lift:0 40px 70px -36px rgba(0,0,0,.85),0 2px 12px -4px rgba(0,0,0,.5);--shine:rgba(255,255,255,.4);--chip:rgba(15,24,41,.45);--chip-ink:#FFFFFF;--tab:#FFFFFF;--tab-pad:5px 9px}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body,Arial,"Liberation Sans",Helvetica,sans-serif);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #5D8FAF;outline-offset:2px}
/* Something for the glass to sit in front of: soft pools of the house colors behind the page, one set for Night and one for Daylight. They sit under the wash. */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;transition:opacity .45s ease}
body::before{opacity:0;background:radial-gradient(75vmax 55vmax at 8% 0%,rgba(93,143,175,.5),transparent 62%),radial-gradient(65vmax 50vmax at 104% 36%,rgba(62,104,131,.46),transparent 60%),radial-gradient(60vmax 44vmax at -6% 100%,rgba(183,35,25,.3),transparent 62%),radial-gradient(55vmax 42vmax at 96% 104%,rgba(93,143,175,.28),transparent 60%)}
body::after{background:radial-gradient(75vmax 55vmax at 8% 0%,rgba(93,143,175,.42),transparent 62%),radial-gradient(65vmax 50vmax at 104% 36%,rgba(1,43,78,.16),transparent 60%),radial-gradient(60vmax 44vmax at -6% 100%,rgba(183,35,25,.13),transparent 62%),radial-gradient(55vmax 42vmax at 96% 104%,rgba(93,143,175,.3),transparent 60%)}
html[data-theme=night] body::before{opacity:1}
html[data-theme=night] body::after{opacity:0}
.bar{height:4px;background:var(--ink);opacity:.9}
.wrap{max-width:452px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
/* The pane. What is behind it shows through, blurred. A bright line along the top and left edge and a darker one along the bottom give it thickness. */
.card{position:relative;padding:10px;background-color:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift),inset 0 1px 0 var(--shine),inset 1px 0 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.14);-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background-color:var(--glass-flat)}}
/* Light lying across the pane: brighter toward the top left corner, a faint return at the bottom right. It lies over the photo too. */
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,0) 9%,rgba(255,255,255,.09) 15%,rgba(255,255,255,.035) 24%,rgba(255,255,255,0) 31%),linear-gradient(128deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 44%,rgba(255,255,255,0) 70%,rgba(255,255,255,.09) 100%)}
/* One glint across the pane as the card arrives. */
.card::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(112deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.34) 50%,rgba(255,255,255,0) 62%) no-repeat;background-size:260% 100%}
.top{position:relative;overflow:hidden}
.photo{display:block;width:100%;height:auto;aspect-ratio:800/731;object-fit:cover;object-position:50% 0;background:rgba(255,255,255,.08)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
@media (max-height:640px){.photo{aspect-ratio:4/3}}
@media (max-height:460px){.photo{aspect-ratio:2/1;object-position:50% 12%}}
/* Night and Daylight: a moon by night, a sun by day, one tap to switch. A small chip of the same glass, on the photo. */
.mode{position:absolute;z-index:3;top:8px;right:8px;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.4);background:var(--chip);color:var(--chip-ink);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.mode[hidden]{display:none}
.mode svg{grid-area:1/1;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
.mode .moon{opacity:0;transform:rotate(-70deg) scale(.5)}
html[data-theme=night] .mode .sun{opacity:0;transform:rotate(70deg) scale(.5)}
html[data-theme=night] .mode .moon{opacity:1;transform:none}
.who{padding:18px 10px 0}
h1{margin:0;font-size:clamp(24px,7.1vw,30px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.role{margin:8px 0 0;font-size:16px;line-height:1.3;color:var(--muted)}
.co{margin:13px 0 0;line-height:0}
.co span{display:inline-block;background:var(--tab);padding:var(--tab-pad)}
.co img{display:block;height:20px;width:auto}
.actions{padding:18px 10px 16px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 12px;border:1px solid var(--line);font-size:16px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;text-align:center;touch-action:manipulation}
.btn svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.primary{background:var(--solid);color:var(--inverse);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 22px -14px rgba(0,0,0,.55)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.trio .btn{flex-direction:column;gap:7px;min-height:72px;padding:10px 4px;font-size:13px;background:var(--tile);box-shadow:inset 0 1px 0 var(--shine)}
.lines{margin:0;border-top:1px solid var(--hair)}
.lines div{display:flex;align-items:baseline;gap:12px;padding:0 10px;border-bottom:1px solid var(--hair)}
.lines dt{flex:none;width:58px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lines dd{margin:0;min-width:0;flex:1}
.lines a{display:block;padding:14px 0;font-size:16px;overflow-wrap:anywhere}
.show{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--muted);touch-action:manipulation}
.show svg{flex:none;width:20px;height:20px;fill:currentColor}
@media (hover:hover){.primary:hover{opacity:.93}.lines a:hover,.show:hover{color:var(--ink)}.trio .btn:hover{border-color:var(--ink);background:var(--glass)}.lines a:hover{text-decoration:underline}.mode:hover{border-color:rgba(255,255,255,.75)}}
.btn:active,.show:active{opacity:.7}
@media (min-width:700px){.wrap{padding-top:48px}}
@media (max-height:640px){.who{padding-top:14px}.co{margin-top:10px}.actions{padding-top:14px}}
@media (max-width:340px){.card{padding:8px}.who,.actions{padding-left:8px;padding-right:8px}.lines div{padding:0 8px}}
/* The card comes up in three steps on load, then the glint crosses it. This is the page's own, so it runs at first paint and does not wait for wash.js. */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes glint{from{opacity:1;background-position:130% 0}to{opacity:1;background-position:-40% 0}}
@media (prefers-reduced-motion:no-preference){.top,.who,.actions{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}.who{animation-delay:.07s}.actions{animation-delay:.14s}.card::after{animation:glint 1.15s cubic-bezier(.3,.6,.3,1) .55s 1 both}}
@media (prefers-reduced-motion:reduce){.mode svg,body::before,body::after{transition:none}}
/* The QR sheet opens with the address card.html#qr, so it needs no script, the back button closes it, and that address can be saved to a home screen to open straight on the code.
   It is glass too: the card stays in view behind it, blurred. The code itself sits on plain white, which a reader needs. */
.sheet{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));background:rgba(1,32,60,.7);color:#FFFFFF;text-align:center;-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet{background:#012B4E}}
.sheet:target{display:flex}
.sheet .away{position:absolute;inset:0;cursor:default}
.sheet .in{position:relative;width:100%;max-width:380px}
.sheet svg{display:block;width:min(100%,58vh);width:min(100%,58svh);height:auto;margin:0 auto;background:#FFFFFF;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.sheet h2{margin:22px 0 0;font-size:22px;line-height:1.2;font-weight:700}
.sheet p{margin:6px 0 0;font-size:15px;color:#C6D8E4}
.sheet .btn{margin:22px auto 0;max-width:220px;border-color:rgba(255,255,255,.7);color:#FFFFFF;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
@media (prefers-reduced-motion:no-preference){.sheet:target .in{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}}
</style>

(function(){var root=document.documentElement,KEY='ac-card-theme',b=document.getElementById('mode'),bar=document.querySelector('meta[name=theme-color]');
function night(){return root.getAttribute('data-theme')==='night'}
function show(){var n=night();if(b){b.setAttribute('aria-label',n?'Switch to daylight':'Switch to night');b.title=n?'Night. Tap for daylight':'Daylight. Tap for night'}if(bar)bar.content=n?'#0F1829':'#E3ECF3'}
function set(n){if(n)root.setAttribute('data-theme','night');else root.removeAttribute('data-theme');show()}
if(b){b.hidden=false;b.addEventListener('click',function(){var n=!night();try{localStorage.setItem(KEY,n?'night':'day')}catch(e){}set(n)})}
addEventListener('storage',function(e){if(e.key===KEY)set(e.newValue!=='day')});show();
function sync(){root.style.overflow=location.hash==='#qr'?'hidden':''}
addEventListener('hashchange',sync);sync();
addEventListener('keydown',function(e){if(e.key==='Escape'&&location.hash==='#qr')location.hash='#card'})})();
</script>
</body>
</html>
